name: CI

on:
  push:
    branches: ["main", "milestone/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify:
    name: C++17/C++20 Engine, PyTorch/ONNX Export & Numerical Parity Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install PyTorch CPU, ONNX & pinned test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -r requirements.txt

      - name: Build C++17 & C++20 binaries, run unit tests, verify PyTorch/ONNX/C++ parity & benchmark
        run: python -B scripts/build_and_test.py
